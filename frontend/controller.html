<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/controller.css?v=16">
    <link rel="icon" href="Assets/favico/favicon_io/android-chrome-512x512.png">
    <title>Control Panel</title>
</head>



<body data-page="controller">
    <!-- Layout toolbar: SETUP shows everything, LIVE hides pre-match setup panels (js/panels.js) -->
    <div class="ui-toolbar" id="ui-toolbar">
        <div class="mode-seg" role="group" aria-label="Controller mode">
            <button type="button" data-ui-mode="setup" title="Show every control">SETUP</button>
            <button type="button" data-ui-mode="live" title="Show only picks, bans, draft buttons and timer">LIVE</button>
            <button type="button" data-ui-mode="ingame" title="Show only in-game controls: score, casters, map, objectives, cams">INGAME</button>
        </div>
        <span class="ui-note" id="ui-note"></span>
        <span class="ui-spacer"></span>
        <button type="button" id="panels-collapse-all">COLLAPSE ALL</button>
        <button type="button" id="panels-expand-all">EXPAND ALL</button>
    </div>

    <div class="main-container">
        <div class="blue-side team-container">
            <div class="side-title"><span>BLUE SIDE</span><span class="side-team" data-team-input="blueTeamName"></span></div>

            <section class="panel" data-panel="team" data-group="setup">
                <button type="button" class="panel-head"><span class="panel-title">TEAM INFO</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="team-desc">
                        <input type="text" name="Team Name" id="blueTeamName" placeholder="BLUE TEAM NAME">
                        <label class="custom-file-upload">
                            <input type="file" class="team-logo-upload" accept="image/*" data-team="blue">
                            Upload Logo
                        </label>
                        <input type="text" name="Cam Link" id="team-cam-link-1" placeholder="CAMERA LINK">
                        <button style="width: 31%;" data-score-team="blue" data-score-delta="1">ADD SCORE</button>
                        <button style="width: 31%;" data-score-team="blue" data-score-delta="-1">DEDUCT SCORE</button>
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="cams" data-group="setup">
                <button type="button" class="panel-head"><span class="panel-title">CAMERA LINKS</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="camLinks">
                        <input type="text" id="cam-1" placeholder="CAMERA LINK">
                        <input type="text" id="cam-2" placeholder="CAMERA LINK">
                        <input type="text" id="cam-3" placeholder="CAMERA LINK">
                        <input type="text" id="cam-4" placeholder="CAMERA LINK">
                        <input type="text" id="cam-5" placeholder="CAMERA LINK">
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="names" data-group="setup">
                <button type="button" class="panel-head"><span class="panel-title">PLAYER NAMES/IGN</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="names">
                        <input type="text" id="input-name-1" placeholder="PLAYER ONE">
                        <input type="text" id="input-name-2" placeholder="PLAYER TWO">
                        <input type="text" id="input-name-3" placeholder="PLAYER THREE">
                        <input type="text" id="input-name-4" placeholder="PLAYER FOUR">
                        <input type="text" id="input-name-5" placeholder="PLAYER FIVE">
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="photos" data-group="setup">
                <button type="button" class="panel-head"><span class="panel-title">PLAYER PHOTOS</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="photos">
                        <label class="custom-file-upload photo-upload" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="1">
                            <span>P1 PHOTO</span>
                        </label>
                        <label class="custom-file-upload photo-upload" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="2">
                            <span>P2 PHOTO</span>
                        </label>
                        <label class="custom-file-upload photo-upload" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="3">
                            <span>P3 PHOTO</span>
                        </label>
                        <label class="custom-file-upload photo-upload" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="4">
                            <span>P4 PHOTO</span>
                        </label>
                        <label class="custom-file-upload photo-upload" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="5">
                            <span>P5 PHOTO</span>
                        </label>
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="picks" data-group="draft">
                <button type="button" class="panel-head"><span class="panel-title">PLAYER PICKS</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="picks">
                        <div class="input-wrapper">
                            <input type="text" id="pick-1" placeholder="PLAYER ONE" autocomplete="off" tabindex="7">
                            <div class="dropdown" id="dropdown-1"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="pick-4" placeholder="PLAYER TWO" autocomplete="off" tabindex="10">
                            <div class="dropdown" id="dropdown-4"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="pick-5" placeholder="PLAYER THREE" autocomplete="off" tabindex="11">
                            <div class="dropdown" id="dropdown-5"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="pick-8" placeholder="PLAYER FOUR" autocomplete="off" tabindex="18">
                            <div class="dropdown" id="dropdown-8"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="pick-9" placeholder="PLAYER FIVE" autocomplete="off" tabindex="20">
                            <div class="dropdown" id="dropdown-9"></div>
                        </div>
                    </div>

                    <div class="swapping-area" id="blue-swap">
                        <button id="swap-1">swap</button>
                        <button id="swap-2">swap</button>
                        <button id="swap-3">swap</button>
                        <button id="swap-4">swap</button>
                        <button id="swap-5">swap</button>
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="bans" data-group="draft">
                <button type="button" class="panel-head"><span class="panel-title">BANS</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="bans">
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-1" placeholder="BLUE BAN 1" autocomplete="off" tabindex="1">
                            <div class="dropdown" id="dropdown-ban-1"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-3" placeholder="BLUE BAN 2" autocomplete="off" tabindex="3">
                            <div class="dropdown" id="dropdown-ban-3"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-5" placeholder="BLUE BAN 3" autocomplete="off" tabindex="5">
                            <div class="dropdown" id="dropdown-ban-5"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-8" placeholder="BLUE BAN 4" autocomplete="off" tabindex="14">
                            <div class="dropdown" id="dropdown-ban-8"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-10" placeholder="BLUE BAN 5" autocomplete="off" tabindex="16">
                            <div class="dropdown" id="dropdown-ban-10"></div>
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <div class="red-side team-container">
            <div class="side-title"><span>RED SIDE</span><span class="side-team" data-team-input="redTeamName"></span></div>

            <section class="panel" data-panel="team" data-group="setup">
                <button type="button" class="panel-head"><span class="panel-title">TEAM INFO</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="team-desc">
                        <input type="text" name="Team Name" id="redTeamName" placeholder="RED TEAM NAME">
                        <label class="custom-file-upload red">
                            <input type="file" class="team-logo-upload" accept="image/*" data-team="red">
                            Upload Logo
                        </label>
                        <input type="text" name="Cam Link" id="team-cam-link-2" placeholder="CAMERA LINK">
                        <button style="width: 31%;" data-score-team="red" data-score-delta="1">ADD SCORE</button>
                        <button style="width: 31%;" data-score-team="red" data-score-delta="-1">DEDUCT SCORE</button>
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="cams" data-group="setup">
                <button type="button" class="panel-head"><span class="panel-title">CAMERA LINKS</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="camLinks">
                        <input type="text" id="cam-10" placeholder="CAMERA LINK">
                        <input type="text" id="cam-9" placeholder="CAMERA LINK">
                        <input type="text" id="cam-8" placeholder="CAMERA LINK">
                        <input type="text" id="cam-7" placeholder="CAMERA LINK">
                        <input type="text" id="cam-6" placeholder="CAMERA LINK">
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="names" data-group="setup">
                <button type="button" class="panel-head"><span class="panel-title">PLAYER NAMES/IGN</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="names">
                        <input type="text" id="input-name-10" placeholder="PLAYER FIVE">
                        <input type="text" id="input-name-9" placeholder="PLAYER FOUR">
                        <input type="text" id="input-name-8" placeholder="PLAYER THREE">
                        <input type="text" id="input-name-7" placeholder="PLAYER TWO">
                        <input type="text" id="input-name-6" placeholder="PLAYER ONE">
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="photos" data-group="setup">
                <button type="button" class="panel-head"><span class="panel-title">PLAYER PHOTOS</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="photos">
                        <label class="custom-file-upload photo-upload red" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="10">
                            <span>P5 PHOTO</span>
                        </label>
                        <label class="custom-file-upload photo-upload red" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="9">
                            <span>P4 PHOTO</span>
                        </label>
                        <label class="custom-file-upload photo-upload red" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="8">
                            <span>P3 PHOTO</span>
                        </label>
                        <label class="custom-file-upload photo-upload red" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="7">
                            <span>P2 PHOTO</span>
                        </label>
                        <label class="custom-file-upload photo-upload red" title="Click to upload a player photo">
                            <input type="file" class="player-photo-upload" accept="image/*" data-slot="6">
                            <span>P1 PHOTO</span>
                        </label>
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="picks" data-group="draft">
                <button type="button" class="panel-head"><span class="panel-title">PLAYER PICKS</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="picks">
                        <div class="input-wrapper">
                            <input type="text" id="pick-10" placeholder="PLAYER FIVE" autocomplete="off" tabindex="19">
                            <div class="dropdown" id="dropdown-10"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="pick-7" placeholder="PLAYER FOUR" autocomplete="off" tabindex="17">
                            <div class="dropdown" id="dropdown-7"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="pick-6" placeholder="PLAYER THREE" autocomplete="off" tabindex="12">
                            <div class="dropdown" id="dropdown-6"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="pick-3" placeholder="PLAYER TWO" autocomplete="off" tabindex="9">
                            <div class="dropdown" id="dropdown-3"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="pick-2" placeholder="PLAYER ONE" autocomplete="off" tabindex="8">
                            <div class="dropdown" id="dropdown-2"></div>
                        </div>
                    </div>

                    <div class="swapping-area" id="red-swap">
                        <button id="swap-10">swap</button>
                        <button id="swap-9">swap</button>
                        <button id="swap-8">swap</button>
                        <button id="swap-7">swap</button>
                        <button id="swap-6">swap</button>
                    </div>
                </div>
            </section>

            <section class="panel" data-panel="bans" data-group="draft">
                <button type="button" class="panel-head"><span class="panel-title">BANS</span><span class="panel-chip"></span></button>
                <div class="panel-body">
                    <div class="bans">
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-9" placeholder="RED BAN 5" autocomplete="off" tabindex="15">
                            <div class="dropdown" id="dropdown-ban-9"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-7" placeholder="RED BAN 4" autocomplete="off" tabindex="13">
                            <div class="dropdown" id="dropdown-ban-7"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-6" placeholder="RED BAN 3" autocomplete="off" tabindex="6">
                            <div class="dropdown" id="dropdown-ban-6"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-4" placeholder="RED BAN 2" autocomplete="off" tabindex="4">
                            <div class="dropdown" id="dropdown-ban-4"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="Ban" id="ban-2" placeholder="RED BAN 1" autocomplete="off" tabindex="2">
                            <div class="dropdown" id="dropdown-ban-2"></div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <div class="second-container">
        <section class="panel" data-panel="draft-control" data-group="draft">
            <button type="button" class="panel-head"><span class="panel-title">DRAFT CONTROL</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <button id="reset">RESET DRAFT</button>
                <button id="switch">SWITCH TEAMS</button>
                <button id="show-display-button">SHOW DISPLAY</button>
                <button id="show-heroes-display" title="Switch the overlay to the heroes lineup now">SHOW HEROES</button>
                <button id="show-draft-display" title="Switch the overlay back to the draft display">SHOW DRAFT</button>
            </div>
        </section>

        <section class="panel" data-panel="timer" data-group="draft">
            <button type="button" class="panel-head"><span class="panel-title">TIMER CONTROL</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <button id="startBtn">START</button>
                <button id="resetPhase">RESET</button>
                <button id="nextPhaseBtn">NEXT PHASE</button>
                <div class="phase-info" id="phaseInfo">
                    CURRENT PHASE: <span id="currentPhase">0</span>/18
                </div>
            </div>
        </section>

        <section class="panel panel-casters" data-panel="caster-cams" data-group="draft">
            <button type="button" class="panel-head"><span class="panel-title">CASTER CAMS</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <div class="caster-layout-row">
                    <button type="button" class="toggle-btn" data-caster-layout="1" aria-pressed="false" title="Show one caster cam (click again to hide)">1 CASTER</button>
                    <button type="button" class="toggle-btn" data-caster-layout="2" aria-pressed="false" title="Show two caster cams (click again to hide)">2 CASTERS</button>
                    <span class="caster-hint" id="caster-cams-hint">CASTER CAMS OFF</span>
                </div>
                <div class="caster-row" data-caster-slot="1" hidden>
                    <span class="caster-tag">CASTER 1</span>
                    <input type="text" id="caster-name-1" data-paste placeholder="CASTER 1 NAME" aria-label="Caster 1 name">
                    <input type="url" id="caster-link-1" data-paste="replace" class="caster-link" placeholder="VDO.NINJA LINK (PRESS ENTER)" aria-label="Caster 1 vdo.ninja link">
                </div>
                <div class="caster-row" data-caster-slot="2" hidden>
                    <span class="caster-tag">CASTER 2</span>
                    <input type="text" id="caster-name-2" data-paste placeholder="CASTER 2 NAME" aria-label="Caster 2 name">
                    <input type="url" id="caster-link-2" data-paste="replace" class="caster-link" placeholder="VDO.NINJA LINK (PRESS ENTER)" aria-label="Caster 2 vdo.ninja link">
                </div>
            </div>
        </section>

        <section class="panel" data-panel="match-info" data-group="setup">
            <button type="button" class="panel-head"><span class="panel-title">MATCH INFO CONTROL</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <input type="text" placeholder="GAME NUMBER" id="gameNumberInput">
                <input type="text" placeholder="MATCH NUMBER" id="matchNumberInput">
                <div class="menu" id="customMenu">
                    <div class="menu-toggle" id="menuToggle">Select Match</div>
                    <div class="menu-options">
                        <div>TRYOUTS</div>
                        <div>GRAND FINALS</div>
                        <div>SEMI FINAL</div>
                        <div>PLAYOFFS</div>
                        <div>LOWER BRACKET</div>
                        <div>UPPER BRACKET</div>
                        <div>PRELIMINARY ROUNDS</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel" data-panel="clear" data-group="draft">
            <button type="button" class="panel-head"><span class="panel-title">CLEAR / RESET</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <button id="clear-names">CLEAR NAMES</button>
                <button id="clear-picks">CLEAR PICKS</button>
                <button id="clear-bans">CLEAR BANS</button>
                <button id="clear-scores">CLEAR SCORES</button>
                <button id="clear-logos">CLEAR LOGO</button>
                <button id="clear-cam-links">CLEAR CAM LINK</button>
                <button id="clear-player-photos">CLEAR PHOTOS</button>
            </div>
        </section>

        <section class="panel" data-panel="photo-settings" data-group="setup">
            <button type="button" class="panel-head"><span class="panel-title">PHOTO SETTINGS</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <label class="toggle-option" title="Automatically cut the player out of uploaded photos">
                    <input type="checkbox" id="photo-auto-bg" checked>
                    AUTO REMOVE PHOTO BG
                </label>
                <label class="toggle-option" title="Line up every player's head at the same size and height">
                    <input type="checkbox" id="photo-auto-align" checked>
                    AUTO ALIGN HEADS
                </label>
                <div id="photo-zoom-global-holder" class="toggle-option"></div>
                <button id="reset-photo-adjust" title="Reset every photo zoom and position (keeps the photos)">RESET PHOTO ADJUSTMENTS</button>
            </div>
        </section>
    </div>

    <!-- INGAME mode only (js/ingame.js) -->
    <div class="ingame-container">
        <section class="panel" data-panel="ingame-score" data-group="ingame">
            <button type="button" class="panel-head"><span class="panel-title">SCORE</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <div class="score-row blue">
                    <span class="score-team" data-score-team-name="blueTeamName">BLUE</span>
                    <span class="score-value" data-score-value="blue">0</span>
                    <button type="button" data-score-team="blue" data-score-delta="1">ADD SCORE</button>
                    <button type="button" data-score-team="blue" data-score-delta="-1">DEDUCT SCORE</button>
                </div>
                <div class="score-row red">
                    <span class="score-team" data-score-team-name="redTeamName">RED</span>
                    <span class="score-value" data-score-value="red">0</span>
                    <button type="button" data-score-team="red" data-score-delta="1">ADD SCORE</button>
                    <button type="button" data-score-team="red" data-score-delta="-1">DEDUCT SCORE</button>
                </div>
            </div>
        </section>

        <section class="panel" data-panel="ingame-info" data-group="ingame">
            <button type="button" class="panel-head"><span class="panel-title">CASTERS &amp; MAP</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <input type="text" id="casters-input" data-paste class="wide" placeholder="CASTERS" aria-label="Casters">
                <select id="map-type-select" aria-label="Map type">
                    <option value="">SELECT MAP TYPE</option>
                    <option value="healing-turtle">HEALING TURTLE</option>
                    <option value="revealing-wisps">REVEALING WISPS</option>
                    <option value="golden-turret">GOLDEN TURRET</option>
                    <option value="flying-cloud">FLYING CLOUD</option>
                </select>
            </div>
        </section>

        <section class="panel" data-panel="ingame-events" data-group="ingame">
            <button type="button" class="panel-head"><span class="panel-title">OBJECTIVES &amp; REPLAY</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <button type="button" data-ingame-event="turtle" title="Send once">TURTLE</button>
                <button type="button" data-ingame-event="lord" title="Send once">LORD</button>
                <button type="button" data-ingame-event="replay" title="Send once">REPLAY</button>
                <button type="button" data-ingame-event="item-check" title="Send once">ITEM CHECK</button>
            </div>
        </section>

        <section class="panel" data-panel="ingame-cams" data-group="ingame">
            <button type="button" class="panel-head"><span class="panel-title">CAMS</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <button type="button" class="toggle-btn" data-ingame-cam="player-1" aria-pressed="false">PLAYER 1</button>
                <button type="button" class="toggle-btn" data-ingame-cam="player-2" aria-pressed="false">PLAYER 2</button>
                <button type="button" class="toggle-btn" data-ingame-cam="player-3" aria-pressed="false">PLAYER 3</button>
                <button type="button" class="toggle-btn" data-ingame-cam="player-4" aria-pressed="false">PLAYER 4</button>
                <button type="button" class="toggle-btn" data-ingame-cam="player-5" aria-pressed="false">PLAYER 5</button>
                <button type="button" class="toggle-btn" data-ingame-cam="team" aria-pressed="false">TEAM CAMS</button>
                <button type="button" id="ingame-cams-off">ALL CAMS OFF</button>
            </div>
        </section>

        <section class="panel panel-wide" data-panel="ingame-sponsors" data-group="ingame">
            <button type="button" class="panel-head"><span class="panel-title">SPONSOR SLIDESHOW</span><span class="panel-chip"></span></button>
            <div class="panel-body">
                <div class="sponsor-row">
                    <span class="sponsor-label">IN PARTNERSHIP WITH <span class="sponsor-count" data-sponsor-count="partner"></span></span>
                    <label class="custom-file-upload sponsor-upload" title="Upload one or more logos">
                        <input type="file" accept="image/*" multiple data-sponsor-upload="partner">
                        ADD LOGO
                    </label>
                    <div class="sponsor-list" data-sponsor-list="partner"></div>
                </div>
                <div class="sponsor-row">
                    <span class="sponsor-label">PRESENTED BY <span class="sponsor-count" data-sponsor-count="presented"></span></span>
                    <label class="custom-file-upload sponsor-upload" title="Upload one or more logos">
                        <input type="file" accept="image/*" multiple data-sponsor-upload="presented">
                        ADD LOGO
                    </label>
                    <div class="sponsor-list" data-sponsor-list="presented"></div>
                </div>
                <div class="sponsor-row">
                    <span class="sponsor-label">SPONSORED BY <span class="sponsor-count" data-sponsor-count="sponsored"></span></span>
                    <label class="custom-file-upload sponsor-upload" title="Upload one or more logos">
                        <input type="file" accept="image/*" multiple data-sponsor-upload="sponsored">
                        ADD LOGO
                    </label>
                    <div class="sponsor-list" data-sponsor-list="sponsored"></div>
                </div>
                <div class="sponsor-row">
                    <span class="sponsor-label">OFFICIAL MONITOR <span class="sponsor-count" data-sponsor-count="monitor"></span></span>
                    <label class="custom-file-upload sponsor-upload" title="Upload one or more logos">
                        <input type="file" accept="image/*" multiple data-sponsor-upload="monitor">
                        ADD LOGO
                    </label>
                    <div class="sponsor-list" data-sponsor-list="monitor"></div>
                </div>
                <div class="sponsor-row">
                    <span class="sponsor-label">DRAFT DISPLAY</span>
                    <button type="button" class="toggle-btn" data-sponsor-style="center" aria-pressed="true" title="One logo at a time under DRAFTING">CENTER SLIDESHOW</button>
                    <button type="button" class="toggle-btn" data-sponsor-style="top" aria-pressed="false" title="Every logo at once in a strip across the top">TOP STRIP</button>
                </div>
                <div class="sponsor-row">
                    <label class="sponsor-label" for="sponsor-interval">SECONDS PER LOGO</label>
                    <input type="number" id="sponsor-interval" min="1" step="1" value="5">
                    <button type="button" id="clear-sponsors">CLEAR ALL SPONSORS</button>
                    <span class="sponsor-note" id="sponsor-note"></span>
                </div>
            </div>
        </section>
    </div>
