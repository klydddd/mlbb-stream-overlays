<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Assets/favico/favicon_io/android-chrome-512x512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/gameDisplay.css?v=6">
    <title>Game Overlay</title>
</head>

<!-- In-game overlay (OBS browser source, 1920x1080, transparent).
     Driven by the INGAME tab of controller.html via js/gameDisplay.js. -->
<body>
    <div class="stage" id="stage">

        <!-- white frame around the in-game minimap -->
        <div class="minimap-frame"></div>

        <!-- top scoreboard -->
        <div class="scoreboard">
            <div class="sb-band"></div>

            <div class="sb-side blue">
                <div class="sb-icons">
                    <svg class="ic"><use href="#ic-turtle" /></svg>
                    <svg class="ic"><use href="#ic-lord" /></svg>
                    <svg class="ic"><use href="#ic-tower" /></svg>
                    <svg class="ic"><use href="#ic-gold" /></svg>
                </div>
                <div class="sb-plate">
                    <span class="sb-name" id="blue-name">TEAM</span>
                    <div class="sb-pips" id="blue-pips"><i></i><i></i><i></i></div>
                </div>
                <span class="sb-score" id="blue-score">0</span>
            </div>

            <div class="sb-center">
                <span class="sb-timer">00:00</span>
                <img class="sb-logo" src="Assets/gameProper/league-logo.png" alt="" onerror="this.hidden = true">
            </div>

            <div class="sb-side red">
                <div class="sb-icons">
                    <svg class="ic"><use href="#ic-gold" /></svg>
                    <svg class="ic"><use href="#ic-tower" /></svg>
                    <svg class="ic"><use href="#ic-lord" /></svg>
                    <svg class="ic"><use href="#ic-turtle" /></svg>
                </div>
                <div class="sb-plate">
                    <div class="sb-pips" id="red-pips"><i></i><i></i><i></i></div>
                    <span class="sb-name" id="red-name">TEAM</span>
                </div>
                <span class="sb-score" id="red-score">0</span>
            </div>
        </div>

        <!-- sponsor logo slideshow in the white area right of the scoreboard -->
        <div class="sponsors" id="sponsors" hidden>
            <div class="sponsor-slide"><span class="sponsor-label"></span><img alt=""></div>
            <div class="sponsor-slide"><span class="sponsor-label"></span><img alt=""></div>
        </div>

        <!-- casters + map type, right side -->
        <div class="casters" id="casters-bar" hidden>
            <svg class="ic mic"><use href="#ic-mic" /></svg>
            <span id="casters-text"></span>
        </div>

        <div class="map-type" id="map-type-panel" hidden>
            <div class="map-type-icon">
                <!-- Assets/gameProper/maps/<map-slug>.png, hidden until the file exists -->
                <img id="map-type-img" alt="" hidden onerror="this.hidden = true" onload="this.hidden = false">
            </div>
            <span id="map-type-text"></span>
        </div>
    </div>

    <!-- icon sprites -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="ic-turtle" viewBox="0 0 24 24">
                <path fill="currentColor" d="M12 1.2c1.5 0 2.3 1.2 2.3 2.4 0 .7-.2 1.2-.5 1.6 1.9.7 3.3 2.2 3.9 4.1l2.6-1.4c.9-.4 1.7.7 1 1.4l-3.2 2.6c0 .2.1.5.1.7 0 1.7-.5 3.3-1.4 4.5l1.5 2.8c.4.8-.6 1.5-1.2.9l-2.1-2c-.7.4-1.5.7-2.3.8l-.2 2.4c-.1.6-.5 1-.7 1s-.6-.4-.7-1l-.2-2.4c-.8-.1-1.6-.4-2.3-.8l-2.1 2c-.6.6-1.6-.1-1.2-.9l1.5-2.8c-.9-1.2-1.4-2.8-1.4-4.5 0-.2 0-.5.1-.7L2.7 9.3c-.7-.7.1-1.8 1-1.4l2.6 1.4c.6-1.9 2-3.4 3.9-4.1-.3-.4-.5-.9-.5-1.6 0-1.2.8-2.4 2.3-2.4z" />
            </symbol>
            <symbol id="ic-lord" viewBox="0 0 24 24">
                <path fill="currentColor" d="M3 3l3.6 3L9 2.5l3 3.3 3-3.3L17.4 6 21 3v7.5c0 4.8-3.4 8.9-8 10.4V13.6c0-2.5 2-4.6 4.5-5.1-2.3-.2-4.4 1-5.5 2.9-1.1-1.9-3.2-3.1-5.5-2.9 2.5.5 4.5 2.6 4.5 5.1v7.3c-4.6-1.5-8-5.6-8-10.4V3z" />
            </symbol>
            <symbol id="ic-tower" viewBox="0 0 24 24">
                <path fill="currentColor" d="M5 2h3v2.5h2.2V2h3.6v2.5H16V2h3v6l-2.3 2.2.9 8.3H6.4l.9-8.3L5 8V2zm-.5 18h15v2.5h-15V20z" />
            </symbol>
            <symbol id="ic-gold" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="11" fill="currentColor" />
                <text x="12" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="var(--team)">$</text>
            </symbol>
            <symbol id="ic-mic" viewBox="0 0 24 36">
                <rect x="6" y="1" width="12" height="20" rx="6" fill="currentColor" />
                <path fill="none" stroke="var(--purple)" stroke-width="1.4" d="M8 6h8M8 9h8M8 12h8M8 15h8" />
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 15c0 5 4 9 9 9s9-4 9-9M12 24v7" />
                <rect x="6" y="31" width="12" height="3" rx="1.5" fill="currentColor" />
            </symbol>
        </defs>
    </svg>

    <script type="module" src="js/gameDisplay.js?v=3"></script>
</body>

</html>
